name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  claude-review:
    # Public repo: never hand the token to a fork's code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The prompt and the verdict check come from the base branch, so a PR cannot weaken
      # its own review.
      - name: Load the review prompt and verdict check from the base branch
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:scripts/review_verdict.py" > "$RUNNER_TEMP/review_verdict.py"
          {
            echo 'prompt<<PROMPT_EOF'
            git show "origin/$BASE_REF:.github/claude-review-prompt.md"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs opened by the agent identity (gh-bot); the action skips bot actors otherwise.
          allowed_bots: onato-agent
          # The app bot is not a collaborator, so it counts as untrusted and loses the gh tools;
          # the job already runs only for same-repo PRs, never forks.
          restrict_untrusted_prs: false
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            ${{ steps.base.outputs.prompt }}
          claude_args: |
            --permission-mode default
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'
      - name: Fail unless the review approves
        env:
          OUTPUT: ${{ steps.review.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq '[.[] | select(.type == "result")] | last | .permission_denials' "$EXECUTION_FILE" || true
          printf '%s' "$OUTPUT" | jq -r '.verdict, .summary' > "$RUNNER_TEMP/verdict.md" || true
          python3 "$RUNNER_TEMP/review_verdict.py" "$RUNNER_TEMP/verdict.md" "$EXECUTION_FILE"
