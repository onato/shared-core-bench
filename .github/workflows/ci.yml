name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: make lint test coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 scripts/coverage_summary.py scripts=coverage.xml kmp=core-kmp/build/reports/kover/report.xml
