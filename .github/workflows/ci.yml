name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # test_blame_ignore_revs reads the history
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: make lint test coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 scripts/coverage_summary.py scripts=coverage.xml kmp=core-kmp/build/reports/kover/report.xml android=android/app/build/reports/kover/reportApp.xml
  ci-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: brew install xcodegen swiftlint
      # The newest iOS runtime on the image and the newest iPhone it supports (simctl lists those
      # newest first), so the job follows image updates instead of naming a device a later image
      # drops.
      - name: Create a simulator
        run: |
          runtime=$(xcrun simctl list runtimes --json \
            | jq -c '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last')
          device=$(jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | first | .identifier' <<<"$runtime")
          udid=$(xcrun simctl create ci "$device" "$(jq -r .identifier <<<"$runtime")")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - run: make lint-ios test-ios coverage-ios
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 scripts/coverage_summary.py ios=ios/build/coverage.json
